name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes malica app.py server.py tests tools
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Extension package builds
        run: python tools/pack_extension.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t malica:ci .
      - name: Smoke test
        run: |
          docker run -d --name malica -p 8000:8000 -e MALICA_PIN=1234 malica:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/manifest.json >/dev/null && break; sleep 1; done
          test "$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = "200"
          docker logs malica
