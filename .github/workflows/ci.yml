name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes malica app.py server.py tests tools
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Extension package builds
        run: python tools/pack_extension.py
