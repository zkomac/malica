services:
  malica:
    build: .
    image: malica:latest
    container_name: malica
    restart: unless-stopped
    # Only reachable from the host; nginx on the host terminates TLS and proxies here.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - malica.env
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
