  });
}

// Poenostavljena naročilna stran za telefon: /order/<dayId>
const orderDone = {};  // dayId -> Set(indeksov odkljukanih), v pomnilniku
async function renderOrderMode(dayId){
  document.body.classList.add('order-mode');
  const day = state.days.find(d=>d.id===dayId);
  const root = $('#main'); $('#days').innerHTML=''; document.querySelector('header').style.display='none';
  if(!day){ root.innerHTML = `<div class="empty"><h2>Naročilo ni najdeno</h2>Povezava je morda zastarela.<br><a class="btn primary" style="margin-top:12px" href="/">Odpri Malico</a></div>`; return; }
  const v = day.venue || {};
  // združi jedi po vrsti+dodatkih
  const items = {};
  for(const o of day.orders){ const k=o.itemId+'|'+o.item+(o.options?' — '+o.options:''); items[k] = items[k]||{qty:0, who:[], item:o.item, options:o.options, note:[], itemId:o.itemId}; items[k].qty+=o.qty; items[k].who.push(o.person+(o.qty>1?' ×'+o.qty:'')); if(o.note) items[k].note.push(o.person+': '+o.note); }
  const list = Object.values(items);
  const itemUrl = it => v.url && it.itemId && /^[a-f0-9]{24}$/.test(it.itemId) ? `${v.url}/itemid-${it.itemId}` : (v.url||'');
  const c = calc(day);
  const doneSet = orderDone[dayId] ||= new Set();
  const draw = () => {
    root.innerHTML = `<div class="ordermode">
      <div class="om-head"><a href="/" class="om-back">‹ Malica</a><div class="om-progress">${doneSet.size}/${list.length} dodano</div></div>
      <h1>${esc(day.restaurant)}</h1>
      <p class="sub">${dateLong(day.date)} · ${nOrders(day.orders.length)}${day.deadline?` · rok ${esc(day.deadline)}`:''}</p>
      <p class="om-hint">Pri vsaki jedi klikni <b>Odpri na Woltu</b>, izberi dodatke in jo daj v košarico. Potem jo odkljukaj.</p>
      <div class="om-list">${list.map((it,i)=>`
        <div class="om-item ${doneSet.has(i)?'done':''}" data-i="${i}">
          <button class="om-check" data-check="${i}" title="Označi kot dodano">${doneSet.has(i)?'✓':''}</button>
          <div class="om-body"><div class="om-name"><b>${it.qty}×</b> ${esc(it.item)}</div>${it.options?`<div class="sub">${esc(it.options)}</div>`:''}${it.note.length?`<div class="sub">✎ ${it.note.map(esc).join(' · ')}</div>`:''}<div class="sub">${esc(it.who.join(', '))}</div></div>
          ${itemUrl(it)?`<a class="btn primary om-open" href="${esc(itemUrl(it))}" target="_blank" rel="noopener" data-open="${i}">Odpri na Woltu ↗</a>`:'<span class="sub">ročni vnos</span>'}
        </div>`).join('')}</div>
      <div class="om-foot">
        <div class="om-total"><span>Jedi skupaj</span><b>${fmt(c.subtotal)}</b></div>
        ${v.url?`<a class="btn" href="${esc(v.url)}" target="_blank" rel="noopener">Odpri restavracijo na Woltu ↗</a>`:''}
        ${doneSet.size===list.length && list.length?`<div class="banner ok" style="margin-top:10px"><div><b>Vse dodano 🎉</b><div class="sub">Na Woltu preveri košarico in oddaj naročilo, potem spodaj vpiši, koliko si plačal.</div></div></div>`:''}
        ${day.status==='open' ? `<div class="card om-fin"><h3>Zaključi naročilo</h3>
          <p class="sub" style="margin:-4px 0 10px">Ko oddaš naročilo, vpiši <b>končni znesek z Wolta</b> (z dostavo in stroški). Razliko razdelimo med sodelavce.</p>
          <form id="omFin">
            <label>Skupaj plačano na Woltu (€)</label><input name="grandTotal" type="number" step="0.01" min="0" inputmode="decimal" placeholder="${fmt(c.subtotal).replace(' €','')}" style="font-size:1.25rem;width:100%">
            <div class="row" style="margin-top:8px"><div><label>Plačal/a</label><select name="payer">${state.people.map(p=>`<option ${(day.payer||day.orderer)===p?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
            <div><label>Kako razdelimo doplačilo</label><select name="feeSplit"><option value="proportional">sorazmerno</option><option value="equal" ${day.feeSplit==='equal'?'selected':''}>enako na osebo</option></select></div></div>
            <div id="omFinPreview" class="sub" style="margin-top:8px"></div>
          </form>
          <button class="btn primary" data-act="omfinish" style="margin-top:10px">✓ Zaključi in pokaži obračun</button></div>`
        : `<div class="banner ok" style="margin-top:10px"><div><b>Naročilo zaključeno</b><div class="sub">Plačano ${fmt(day.grandTotal||c.subtotal)}${day.payer?` · plačnik ${esc(day.payer)}`:''}</div></div><a class="btn primary" href="/" style="margin-top:8px">Odpri obračun</a></div>`}
      </div></div>`;
    omPreview();
  };
  const omRead = () => { const f=$('#omFin'); if(!f) return null; const d=Object.fromEntries(new FormData(f)); return {...day, grandTotal:+d.grandTotal||0, feeSplit:d.feeSplit, payer:d.payer}; };
  const omPreview = () => { const d=omRead(); const el=$('#omFinPreview'); if(!d||!el) return; const cc=calc(d);
    el.innerHTML = (cc.extra?`Doplačilo ${fmt(cc.extra)} · `:'Brez doplačil · ') + cc.rows.map(r=>`${esc(r.person)} <b>${fmt(r.total)}</b>`).join(' · '); };
  window._omRead = omRead; window._omPreview = omPreview;
  draw();
  if(!window._omBound){ window._omBound = true;
    root.addEventListener('click', e=>{
      if(!orderRoute()) return;
      const ch=e.target.closest('[data-check]'); const op=e.target.closest('[data-open]');
      const fin=e.target.closest('[data-act="omfinish"]');
      if(ch){ const i=+ch.dataset.check; doneSet.has(i)?doneSet.delete(i):doneSet.add(i); draw(); }
      else if(op){ const i=+op.dataset.open; doneSet.add(i); setTimeout(draw,100); }
      else if(fin){ const d=window._omRead && window._omRead(); if(!d) return; const cc=calc(d);
        if(d.grandTotal && d.grandTotal < cc.subtotal && !confirm(`Vpisani znesek (${fmt(d.grandTotal)}) je nižji od cene jedi (${fmt(cc.subtotal)}). Vseeno zaključim?`)) return;
        fin.disabled=true; mutate(`/api/days/${d.id}`, {grandTotal:d.grandTotal, feeSplit:d.feeSplit, payer:d.payer, status:'ordered'}).then(()=>toast('✓ Naročilo zaključeno')).catch(()=>{ fin.disabled=false; }); }
    });
    root.addEventListener('input', e=>{ if(orderRoute() && e.target.closest('#omFin') && window._omPreview) window._omPreview(); });
    root.addEventListener('change', e=>{ if(orderRoute() && e.target.closest('#omFin') && window._omPreview) window._omPreview(); });
  }
}

function historyModal(){
  const T = todayIso();
  const past = state.days.filter(d=>d.date<T).sort((a,b)=>b.date.localeCompare(a.date));
  const rows = past.map(d=>{ const c=calc(d); return `<div class="day" data-histday="${d.id}" style="min-width:0;width:100%;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;cursor:pointer">
    <div><b>${esc(d.restaurant)}</b><div class="sub">${dateSl(d.date)} · ${nOrders(d.orders.length)}${d.payer?` · plačal ${esc(d.payer)}`:''}</div></div>
    <div style="text-align:right"><b>${fmt(c.total)}</b><div class="sub">${d.status==='ordered'?'naročeno':'osnutek'}</div></div></div>`; }).join('');
  openModal(`<div class="body"><h2>🕘 Zgodovina naročil</h2><p class="desc">Pretekli dnevi. Klikni za podrobnosti in obračun.</p>
    ${past.length?rows:'<p class="sub">Še ni preteklih naročil.</p>'}</div>`);
  $('.modal').addEventListener('click', e=>{ const t=e.target.closest('[data-histday]'); if(t){ currentDayId=t.dataset.histday; localStorage.setItem('wolt.day',currentDayId); tab='split'; closeModal(); render(); } });
}

function helpModal(){
  localStorage.setItem('wolt.seen','1');
  openModal(`<div class="body help"><h2>Kako deluje Malica</h2>
    <ol class="steps">
      <li><span class="n">1</span><div><b>Nekdo predlaga restavracijo</b><div class="sub">Klik na <b>+ Predlagaj restavracijo</b>, izbira z Wolta (iskanje, filtri, predogled menija), datum in rok za naročila.</div></div></li>
      <li><span class="n">2</span><div><b>Vsak izbere svojo jed</b><div class="sub">V zavihku <b>Meni</b> klikneš jed, izbereš dodatke in količino. V košarici desno (na telefonu spodaj) vidiš, kaj naročajo sodelavci.</div></div></li>
      <li><span class="n">3</span><div><b>Ena oseba naroči na Woltu</b><div class="sub">Zavihek <b>Povzetek za Wolt</b> ima seznam s povezavami na vsako jed — samo še doda jih v košarico.</div></div></li>
      <li><span class="n">4</span><div><b>Obračun</b><div class="sub">Kdor naroča, klikne <b>Zaključi naročilo</b>, vpiše dostavo in stroške; aplikacija izračuna, koliko kdo nakaže, in kdo je že poravnal.</div></div></li>
    </ol>
    <p class="sub">Namig: na telefonu stran dodaj na začetni zaslon (Deli → Dodaj na začetni zaslon), pa jo imaš kot aplikacijo.</p>
    </div><div class="foot"><button class="btn primary" data-close style="flex:1">Jasno, gremo!</button></div>`);
}

function locationModal(){
  const l = state.location;
  openModal(`<div class="body"><h2>Lokacija pisarne</h2><p class="desc">Wolt prikaže restavracije, ki dostavljajo na to lokacijo.</p>
    <form id="locForm">
      <div class="opt"><label>Ime</label><input name="label" value="${esc(l.label)}" placeholder="npr. Pisarna, Dunajska 5"></div>
      <div class="opt row"><div><label>Zemljepisna širina (lat)</label><input name="lat" type="number" step="any" value="${l.lat}"></div><div><label>Dolžina (lon)</label><input name="lon" type="number" step="any" value="${l.lon}"></div></div>
      <button type="button" class="btn" id="geo">📍 Uporabi mojo trenutno lokacijo</button>
      <p class="sub">Koordinate dobiš tudi z desnim klikom na Google Maps.</p>
    </form></div>
    <div class="foot"><button class="btn primary" id="locSave">Shrani</button></div>`);
  $('#geo').addEventListener('click', ()=>{ navigator.geolocation?.getCurrentPosition(p=>{ $('#locForm').lat.value=p.coords.latitude.toFixed(5); $('#locForm').lon.value=p.coords.longitude.toFixed(5); }, ()=>toast('Lokacije ni bilo mogoče pridobiti')); });
  $('#locSave').addEventListener('click', async ()=>{ await mutate('/api/location', Object.fromEntries(new FormData($('#locForm')))); venuesCache=null; sessionStorage.removeItem('venues'); closeModal(); toast('Lokacija shranjena'); });
}

// ---------- dogodki ----------
$('#meSelect').addEventListener('change', async e=>{
  if(e.target.value==='__switch'){ e.target.value=me; welcomeModal(); return; }
  if(e.target.value==='__admin'){ e.target.value=me; adminModal(); return; }
  if(e.target.value==='__logout'){ e.target.value=me; if(confirm('Izhod iz skupine? Za vrnitev boš potreboval/a PIN.')) location.href='/logout'; return; }
  me=e.target.value;
  localStorage.setItem('wolt.me', me); render();
});
$('#locBtn').addEventListener('click', locationModal);
$('#helpBtn').addEventListener('click', helpModal);

document.addEventListener('click', async e=>{
  if(!e.target.closest('[data-act="daymenu"]')) document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open'));
  if(e.target.closest('[data-close]') || (e.target.classList.contains('backdrop'))) { closeModal(); return; }
  const sc = e.target.closest('[data-scroll]'); if(sc){ document.getElementById(sc.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  const pt = e.target.closest('[data-paid-toggle]'); if(pt){ const day=curDay(); const paid=new Set(day.paid); paid.has(pt.dataset.paidToggle)?paid.delete(pt.dataset.paidToggle):paid.add(pt.dataset.paidToggle); await mutate(`/api/days/${day.id}`,{paid:[...paid]}); return; }
  const dd = e.target.closest('[data-delday]'); if(dd){ e.stopPropagation(); const d=state.days.find(x=>x.id===dd.dataset.delday); if(d && confirm(`Izbrišem restavracijo ${d.restaurant} (${dateSl(d.date)})${d.orders.length?` skupaj z ${nOrders(d.orders.length)}`:''}? Tega ni mogoče razveljaviti (admin lahko obnovi prejšnjo različico).`)){ await mutate(`/api/days/${d.id}/delete`,{}); toast('Dan izbrisan'); } return; }
  const t = e.target.closest('[data-new],[data-day],[data-tab],[data-act],[data-edit],[data-delorder],[data-item],[data-focustab]');
  if(!t) return;
  const day = curDay();
  if(t.dataset.new!==undefined){ if(!me){ welcomeModal(); return; } pickerModal(); }
  else if(t.dataset.day){ currentDayId=t.dataset.day; localStorage.setItem('wolt.day',currentDayId); tab = curDay()?.status==='ordered' ? 'split' : 'menu'; render(); }
  else if(t.dataset.tab){ tab=t.dataset.tab; render(); }
  else if(t.dataset.item){ if(t.classList.contains('off')) return; if(!me){ welcomeModal(); return; }
    const m = menus[t.dataset.slug]; const it = m.categories.flatMap(c=>c.items).find(i=>i.id===t.dataset.item); itemModal(it); }
  else if(t.dataset.edit){ manualModal(day.orders.find(o=>o.id===t.dataset.edit)); }
  else if(t.dataset.delorder){ const o=day.orders.find(x=>x.id===t.dataset.delorder); if(o && (o.person===me || confirm(`Odstranim naročilo (${o.person}: ${o.item})?`))) { await mutate(`/api/days/${day.id}/orders-delete`,{id:t.dataset.delorder}); toast('Odstranjeno'); } }
  else if(t.dataset.act==='cart'){ cartModal(day); }
  else if(t.dataset.act==='manual'){ if(!me){ welcomeModal(); return; } if(!canOrder(day)){ toast('Naročila so zaprta'); return; } manualModal(); }
  else if(t.dataset.act==='daymenu'){ e.stopPropagation(); t.parentElement.classList.toggle('open'); return; }
  else if(t.dataset.act==='woltpush-go'){ tab='summary'; render(); setTimeout(()=>{ const b=$('#woltPushBtn'); if(b){ b.scrollIntoView({behavior:'smooth',block:'center'}); b.click(); } },50); }
  else if(t.dataset.act==='wolttotal-go'){ tab='summary'; render(); setTimeout(()=>{ const b=$('#woltTotalBtn'); if(b){ b.scrollIntoView({behavior:'smooth',block:'center'}); b.click(); } },50); }
  else if(t.dataset.act==='finish' || t.dataset.act==='edit-fees'){ finishModal(day); }
  else if(t.dataset.act==='status'){ await mutate(`/api/days/${day.id}`,{status:t.dataset.v}); tab = t.dataset.v==='ordered' ? 'split' : 'menu'; render(); }
  else if(t.dataset.act==='editday'){ editDayModal(day); }
  else if(t.dataset.act==='history'){ historyModal(); }
  else if(t.dataset.act==='copyorder'){ await navigator.clipboard.writeText($('#orderLink').value); toast('Povezava kopirana'); }
  else if(t.dataset.focustab){ e.preventDefault(); const r=await extCall({type:'focusTab', tabId:+t.dataset.focustab}); if(r?.error) window.open(t.href,'_blank','noopener'); }
  else if(t.dataset.act==='woltpush'){ const b=$('#woltPushBtn'); b.disabled=true; b.textContent='Pošiljam v Wolt…';
    const r = await extCall({type:'push', dayId: day.id, who: me}); const out=$('#woltPushResult'); if(!out){ return; }
    if(r.error){ const needLogin=/wolt\.com|prijav/i.test(r.error); out.innerHTML=`<div class="banner" style="background:#fdecea;border-color:#f5c6c2"><div><b>✗ ${esc(r.error)}</b></div>${needLogin?`<a class="btn primary" href="https://wolt.com/sl/login" target="_blank" rel="noopener">Prijava na Woltu ↗</a>`:''}</div>`; b.disabled=false; b.textContent='🛒 Poskusi znova'; }
    else { out.innerHTML=`<div class="banner ok"><div><b>✓ V košarici pri ${esc(r.restaurant)}: ${r.pushed} ${plural(r.pushed,'jed','jedi','jedi','jedi')}</b>${r.lines?`<div class="sub">${r.lines.map(l=>`${l.count}× ${esc(l.name)}`).join(' · ')}</div>`:''}${r.skipped.length?`<div class="sub" style="color:var(--red)">Dodaj ročno (ni z Wolta): ${r.skipped.map(esc).join('; ')}</div>`:''}</div><a class="btn primary" href="${esc(r.url)}" target="_blank" rel="noopener" data-focustab="${r.tabId||''}">Odpri Wolt, preveri in plačaj ↗</a>${r.tabId?`<div class="sub" style="margin-top:6px">Wolt se je odprl v novem zavihku s polno košarico. Če je na Woltu kaj zmotilo (npr. okno starega naročila), klikni <b>Pošlji znova</b> — košarica se samo zamenja.</div>`:''}</div>`; b.disabled=false; b.textContent='🔁 Pošlji znova v Wolt košarico'; }
  }
  else if(t.dataset.act==='wolttotal'){ const b=$('#woltTotalBtn'); b.disabled=true; b.textContent='Berem iz Wolta…';
    const r = await extCall({type:'lastOrder', dayId: day.id, who: me}); const out=$('#woltTotalResult'); if(!out) return;
    if(r.error){ out.innerHTML=`<div class="banner" style="background:#fdecea;border-color:#f5c6c2"><div><b>✗ ${esc(r.error)}</b><div class="sub">Znesek lahko vpišeš tudi sam: Naročilo ▾ → Zaključi naročilo.</div></div></div>`; b.disabled=false; b.textContent='💶 Poskusi znova'; }
    else { out.innerHTML=`<div class="banner ok"><div><b>✓ Wolt: plačano ${fmt(r.total)}</b><div class="sub">jedi ${fmt(r.items)} · dostava ${fmt(r.delivery)}${r.tip?` · napitnina ${fmt(r.tip)}`:''} · ${esc(r.time||'')}</div></div></div>`; b.textContent='✓ Prebrano'; finishModal({...day, grandTotal:r.total, payer: day.payer||me}); }
  }
  else if(t.dataset.act==='copy'){ await navigator.clipboard.writeText($('#summaryText').textContent); toast('Kopirano'); }
});

document.addEventListener('change', async e=>{
  if(e.target.dataset.orderer!==undefined){ const day=curDay(); await mutate(`/api/days/${day.id}`,{orderer:e.target.value, payer: day.payer || e.target.value}); toast(e.target.value?`Na Woltu naroča ${e.target.value}`:'Kdo naroča: ni določeno'); return; }
  if(e.target.dataset.paid!==undefined && e.target.type==='checkbox'){
    const day = curDay(); const paid = new Set(day.paid);
    e.target.checked ? paid.add(e.target.dataset.paid) : paid.delete(e.target.dataset.paid);
    await mutate(`/api/days/${day.id}`,{paid:[...paid]});
  }
});
document.addEventListener('submit', async e=>{
  e.preventDefault();
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

refresh();
setInterval(()=>{ if(orderRoute()) return; if(!$('#modalRoot').children.length && !['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName)) refresh(); }, 6000);
</script>
</body>
